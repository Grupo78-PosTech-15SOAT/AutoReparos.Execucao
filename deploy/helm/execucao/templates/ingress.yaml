# Rotas públicas do serviço no ALB interno compartilhado (grupo autoreparos-internal), alcançado pelo
# VPC Link do API Gateway. A ordem do grupo faz as rotas específicas casarem antes do /api do Cadastros.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "servico.nome" . }}
  labels:
    {{- include "servico.rotulos" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/group.name: autoreparos-internal
    alb.ingress.kubernetes.io/group.order: {{ .Values.ingress.ordem | quote }}
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          {{- range .Values.ingress.prefixos }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "servico.nome" $ }}
                port:
                  number: 8080
          {{- end }}
