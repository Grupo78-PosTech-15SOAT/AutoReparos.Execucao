apiVersion: v1
kind: Service
metadata:
  name: {{ include "servico.nome" . }}
  labels:
    {{- include "servico.rotulos" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "servico.seletor" . | nindent 4 }}
