name: CI/CD - AutoReparos.Execucao

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # Na main não cancela: um deploy interrompido deixaria a release do Helm presa em pending-upgrade.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SOLUTION: AutoReparos.Execucao.slnx
  MINIMO_COBERTURA: 80
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore "$SOLUTION"
      - run: dotnet build "$SOLUTION" --no-restore -m:1 -c Release
      - run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore "$SOLUTION"
      - run: dotnet build "$SOLUTION" --no-restore -m:1 -c Release
      - name: Testes de AutoReparos.Execucao.Tests
        run: >-
          dotnet test AutoReparos.Execucao.Tests --no-build --no-restore -m:1 -c Release
          --results-directory TestResults/AutoReparos.Execucao.Tests --logger trx
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Migrations/*.cs,**/obj/**/*.cs"
      - name: Testes de AutoReparos.Execucao.IntegrationTests
        run: >-
          dotnet test AutoReparos.Execucao.IntegrationTests --no-build --no-restore -m:1 -c Release
          --results-directory TestResults/AutoReparos.Execucao.IntegrationTests --logger trx
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Migrations/*.cs,**/obj/**/*.cs"
      - name: Verificar cobertura mínima de linhas
        run: python3 .github/scripts/verificar_cobertura.py TestResults --minimo "$MINIMO_COBERTURA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: resultados-testes
          path: TestResults
          retention-days: 7

  quality:
    needs: test
    if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'grupo78-postech-15soat' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'Grupo78-PosTech-15SOAT_AutoReparos.Execucao' }}
    steps:
      - name: Exigir SONAR_TOKEN
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Segredo SONAR_TOKEN ausente: o quality gate do SonarCloud é obrigatório"
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: resultados-testes
          path: TestResults
      - run: dotnet tool install --global dotnet-sonarscanner
      - name: SonarCloud com quality gate
        run: |
          dotnet sonarscanner begin             /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION"             /d:sonar.token="$SONAR_TOKEN"             /d:sonar.host.url=https://sonarcloud.io             /d:sonar.qualitygate.wait=true             /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"             /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx"             /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**"
          dotnet build "$SOLUTION" -m:1 -c Release
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  # Implanta o serviço na produção (EKS us-east-1): só na main, depois de build, testes e qualidade e da aprovação
  # no Environment production. Ordem: Terraform do serviço -> imagem -> database pelo provisionador -> Secrets ->
  # Helm com --atomic (o hook migra antes do rollout) -> rollout e GET /health.
  deploy:
    needs: [build, test, quality]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-execucao-production
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      SERVICO: execucao
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.4
      - name: Aplicar o Terraform do serviço
        id: terraform
        working-directory: infra/terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"
          terraform apply -input=false -no-color -auto-approve
          {
            echo "ecr_url=$(terraform output -raw ecr_url)"
            echo "irsa_role_arn=$(terraform output -raw irsa_role_arn)"
            echo "segredo_database_arn=$(terraform output -raw segredo_database_arn)"
          } >> "$GITHUB_OUTPUT"
      - name: Publicar a imagem no ECR
        env:
          ECR_URL: ${{ steps.terraform.outputs.ecr_url }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_URL%%/*}"
          docker build -t "$ECR_URL:$IMAGE_TAG" -f Dockerfile .
          docker push "$ECR_URL:$IMAGE_TAG"
      - name: Ler os parâmetros da plataforma
        id: plataforma
        run: |
          set -euo pipefail
          ler() { aws ssm get-parameter --name "$1" --query Parameter.Value --output text; }
          {
            echo "cluster=$(ler /autoreparos/production/eks/cluster_name)"
            echo "provisionador=$(ler /autoreparos/production/provisionador-db/url)"
            echo "emissor=$(ler /autoreparos/production/apigateway/endpoint)"
            echo "conta=$(aws sts get-caller-identity --query Account --output text)"
          } >> "$GITHUB_OUTPUT"
      - name: Criar a database e o usuário (autoreparos-provisionador-db)
        env:
          PROVISIONADOR_URL: ${{ steps.plataforma.outputs.provisionador }}
        run: |
          set -euo pipefail
          # Chamada assinada (SigV4, serviço lambda) com a role de deploy: o provisionador deduz o serviço da role.
          status=$(curl -sS -o "$RUNNER_TEMP/provisionador.json" -w '%{http_code}' -X POST "$PROVISIONADOR_URL" \
            --aws-sigv4 "aws:amz:us-east-1:lambda" \
            --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            -H "x-amz-security-token: $AWS_SESSION_TOKEN" \
            -H 'content-type: application/json' -d '{}')
          cat "$RUNNER_TEMP/provisionador.json"; echo
          if [ "$status" != "200" ]; then
            echo "::error::O provisionador respondeu $status em vez de 200"
            exit 1
          fi
      - name: Conectar ao EKS
        run: aws eks update-kubeconfig --name '${{ steps.plataforma.outputs.cluster }}' --region "$AWS_REGION"
      - name: Criar os Secrets do serviço
        env:
          SEGREDO_DATABASE_ARN: ${{ steps.terraform.outputs.segredo_database_arn }}
        run: |
          set -euo pipefail
          conexao="$(aws secretsmanager get-secret-value --secret-id "$SEGREDO_DATABASE_ARN" --query SecretString --output text | jq -r '.connectionString')"
          test -n "$conexao" && test "$conexao" != "null" || { echo '::error::Segredo da database sem connectionString'; exit 1; }
          echo "::add-mask::$conexao"
          jq -n --arg conexao "$conexao" \
            '{apiVersion:"v1",kind:"Secret",metadata:{name:"execucao-database"},type:"Opaque",stringData:{"ConnectionStrings__Execucao":$conexao}}' \
            | kubectl apply -n "$SERVICO" -f -
          unset conexao
      - name: Implantar com Helm
        env:
          ECR_URL: ${{ steps.terraform.outputs.ecr_url }}
          IRSA_ROLE_ARN: ${{ steps.terraform.outputs.irsa_role_arn }}
          CONTA: ${{ steps.plataforma.outputs.conta }}
          EMISSOR: ${{ steps.plataforma.outputs.emissor }}
        run: |
          set -euo pipefail
          helm upgrade --install "$SERVICO" "deploy/helm/$SERVICO" \
            --namespace "$SERVICO" --atomic --wait --timeout 10m \
            --set-string image.repository="$ECR_URL" \
            --set-string image.tag="$IMAGE_TAG" \
            --set-string image.pullPolicy=Always \
            --set-string aws.conta="$CONTA" \
            --set-string serviceAccount.roleArn="$IRSA_ROLE_ARN" \
            --set-string autenticacao.emissor="$EMISSOR"
      - name: Verificar o rollout e o GET /health
        run: |
          set -euo pipefail
          kubectl rollout status "deployment/$SERVICO" -n "$SERVICO" --timeout=5m
          kubectl port-forward -n "$SERVICO" "service/$SERVICO" 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          encaminhamento=$!
          trap 'kill "$encaminhamento" 2>/dev/null || true' EXIT
          status=000
          for tentativa in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health || true)
            [ "$status" = "200" ] && break
            sleep 2
          done
          if [ "$status" != "200" ]; then
            echo "::error::GET /health no Service $SERVICO respondeu $status em vez de 200"
            cat "$RUNNER_TEMP/port-forward.log" || true
            exit 1
          fi
          echo "GET /health respondeu 200"
